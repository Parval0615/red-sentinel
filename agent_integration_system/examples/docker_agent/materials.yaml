schema_version: agent-materials-v1

agent:
  name: docker_demo_agent
  domain: ecommerce
  framework: python_function
  root_path: .
  entrypoint: adapter:invoke

integration:
  type: docker
  docker_image: local/redsentinel-demo:latest
  adapter_entrypoint: adapter:invoke

nodes:
  - id: input-gateway
    type: input_node
    target: adapter:normalize_input
    defenses:
      - input_firewall

  - id: rag-reader
    type: rag_retriever
    target: adapter:retrieve_docs
    defenses:
      - rag_doc_scanner
      - retrieval_guard

  - id: tool-executor
    type: tool_node
    target: adapter:execute_tool
    defenses:
      - tool_guard
      - permission_guard

  - id: memory-store
    type: memory_node
    target: adapter:store_memory
    defenses:
      - memory_guard

  - id: output-filter
    type: output_node
    target: adapter:format_output
    defenses:
      - output_filter

tools:
  - name: lookup_order
    risk_level: low
    allowed_roles:
      - user
      - support
    side_effect: false

  - name: refund_order
    risk_level: high
    allowed_roles:
      - support
    side_effect: true

  - name: update_user_info
    risk_level: medium
    allowed_roles:
      - user
      - support
    side_effect: true

business:
  domain: ecommerce
  roles:
    - user
    - support
    - admin
  sensitive_data:
    - phone
    - address
    - payment_token
    - system_prompt

rag:
  enabled: true
  document_paths:
    - ./docs
  allow_test_injection: true

evaluation:
  attack_entries:
    - prompt
    - rag_text
  intensity: medium
