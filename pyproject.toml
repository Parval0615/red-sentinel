[project]
name = "agent-runtime-security-lab"
version = "0.1.0"
description = "Agent runtime security research infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
]

[project.optional-dependencies]
sandbox = [
  "jsonschema>=4",
  "httpx>=0.27",
]
direct = ["openai>=1"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3", "langchain-openai>=0.2"]
dev = ["pytest", "ruff", "jsonschema>=4"]
all = [
  "agent-runtime-security-lab[sandbox,direct,langgraph,dev]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
