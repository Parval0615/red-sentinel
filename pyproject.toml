[project]
name = "ai-security-integrated-system"
version = "0.1.0"
description = "Integrated automatic defense, attack, and evaluation systems for AI security research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
  "python-dotenv>=1",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
evaluation = [
  "jsonschema>=4",
  "httpx>=0.27",
]
product = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  # JWT HS256 signing/verification uses Python stdlib HMAC in product_api.auth_service.
  # No third-party JWT package is required for the current product implementation.
]
defense = [
  "langchain",
  "langchain-community",
  "langchain-core",
  "langchain-openai",
  "langchain-text-splitters",
  "langgraph",
  "langgraph-checkpoint-sqlite",
  "chromadb",
  "sentence-transformers",
  "rank_bm25",
  "streamlit",
  "json-repair",
  "cryptography",
]
attack = [
  "reportlab",
  "pymupdf",
  "pypdf",
  "numpy",
  "Pillow",
]
dev = ["pytest", "ruff", "jsonschema>=4"]
all = [
  "ai-security-integrated-system[attack,defense,evaluation,product,dev]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
  "auto_attack_system/src",
  "auto_defense_system/src",
  "auto_evaluation_system/src",
  "agent_integration_system/src",
  "sdk/python/src",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
  "auto_defense_system/legacy_*",
  "auto_evaluation_system/research_notes",
  "third_party/OpenManus/upstream",
]

[tool.ruff.lint]
ignore = [
  "E401",
  "E501",
  "E701",
  "E702",
  "E712",
  "E741",
  "E402",
  "F401",
  "F403",
  "F405",
  "F541",
  "F841",
]

[tool.pytest.ini_options]
testpaths = [
  "agent_integration_system/tests",
  "auto_attack_system/tests",
  "auto_defense_system/tests",
  "auto_evaluation_system/tests",
]
pythonpath = [
  "agent_integration_system/src",
  "auto_attack_system/src",
  "auto_defense_system/src",
  "auto_evaluation_system/src",
  "sdk/python/src",
]
